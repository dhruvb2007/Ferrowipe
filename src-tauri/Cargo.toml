[package]
name = "ferrowipe"
version = "0.1.0"
description = "Fast, lightweight Windows disk cleaner and analyzer built in Rust + Tauri 2"
authors = ["dhruvb2007"]
license = "MIT"
repository = "https://github.com/dhruvb2007/Ferrowipe"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.2", features = [] }
tauri-plugin-shell = "2.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
jwalk = "0.8"
rayon = "1.10"
chrono = "0.4"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_UI_Shell",
    "Win32_Security"
] }
